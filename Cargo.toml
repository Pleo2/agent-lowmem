[package]
name = "agent-lowmem"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "FSL-1.1-MIT"
repository = "https://github.com/Pleo2/agent-lowmem"
homepage = "https://agentlowmem.dev"
description = "Native macOS resource guardrails for agentic development on low-memory Apple Silicon."
readme = "README.md"
publish = false

[dependencies]
rustix = { version = "=1.1.4", features = ["fs", "process"] }
semver = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = { version = "=0.11.0", default-features = false }
signal-hook = { version = "=0.4.4", default-features = false, features = ["iterator"] }
sysctl = "=0.7.1"

[target.'cfg(target_os = "macos")'.dependencies]
libproc = "=0.14.11"

[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "unwind"
